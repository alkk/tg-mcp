name: docker

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    # NOTE: Do NOT add `branches:` filter here - it breaks tag builds

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute revision
        id: rev
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          hash=$(git rev-parse --short=7 HEAD)
          timestamp=$(date -u -d @"$(git log -1 --format=%ct HEAD)" +%Y%m%dT%H%M%S)
          echo "revision=${HEAD_BRANCH}-${hash}-${timestamp}" >> "$GITHUB_OUTPUT"

      - name: build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            REVISION=${{ steps.rev.outputs.revision }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: verify all digests present
        run: |
          expected=2
          actual=$(find /tmp/digests -type f | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "Expected $expected digests, found $actual"
            ls -la /tmp/digests
            exit 1
          fi

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create manifest and push
        working-directory: /tmp/digests
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          tags=(-t "${{ env.IMAGE }}:${HEAD_BRANCH}")
          if [[ "$HEAD_BRANCH" == v* ]]; then
            tags+=(-t "${{ env.IMAGE }}:latest")
          fi
          digests=()
          for d in *; do
            digests+=("${{ env.IMAGE }}@sha256:${d}")
          done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
