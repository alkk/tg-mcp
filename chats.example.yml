# Chat map: the allowlist of telegram chats tg-mcp exposes to the MCP tools and can reply to.
#
# Keys are telegram chat ids (negative for groups and supergroups). Every chat maps to a
# customer slug — the only customer identifier the MCP tools expose. Chat ids never leave
# the server.
#
# label is optional and only needed when one customer has several chats; then every chat of
# that customer needs its own label, so tools can tell them apart. Labels must be unique
# within a customer.
#
# To find a chat id: add the bot to the group and watch the log for the
# "buffering messages from a chat outside the allowlist" line naming it. Messages sent before
# the id lands here are not lost — they are buffered and replayed on the next restart.
#
# public is optional and exposes the chat's newest message, unauthenticated, at
# /public/<alias> — for a website teaser. A chat without it cannot be reached there. Aliases
# are lowercase letters, digits and '-', unique across the whole file, and a namespace of their
# own, so the website never has to learn a customer slug. username is the group's public
# @username (without '@'); it adds a t.me link to that message and requires public. Leave it out
# for a private group.
#
# Note: when a basic group is upgraded to a supergroup its chat id changes. tg-mcp logs the
# migration with old and new id — update this file and restart.

chats:
  # single-group customer, no label needed; a public community group, so exposed
  -1001234567890:
    customer: acme
    public: acme-support
    username: acme_support

  # multi-group customer, every chat labelled
  -1009876543210:
    customer: globex
    label: main
  -1005555555555:
    customer: globex
    label: escalations
